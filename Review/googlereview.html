<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Reviews Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .google-review-widget {
            max-width: 540px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .widget-title {
            font-size: 38px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: #1f1f1f;
        }

        .review-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 36px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .google-logo {
            flex-shrink: 0;
        }

        .review-info {
            flex: 1;
            min-width: 0;
        }

        .info-label {
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 8px;
            color: #202124;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .rating-number {
            font-size: 52px;
            font-weight: 700;
            line-height: 1.1;
            color: #1f1f1f;
        }

        .stars {
            display: flex;
            gap: 2px;
        }

        .star {
            width: 28px;
            height: 28px;
        }

        .review-count {
            font-size: 32px;
            font-weight: 700;
            color: #1f1f1f;
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        .social-icon svg {
            width: 44px;
            height: 44px;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .widget-title {
                font-size: 34px;
            }

            .review-card {
                padding: 36px 28px;
                gap: 30px;
            }

            .rating-number {
                font-size: 48px;
            }

            .review-count {
                font-size: 28px;
            }

            .social-icons {
                gap: 20px;
            }

            .social-icon svg {
                width: 40px;
                height: 40px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            .google-review-widget {
                margin: 24px auto;
            }

            .widget-title {
                font-size: 30px;
                margin-bottom: 16px;
            }

            .review-card {
                flex-direction: column;
                padding: 28px 20px;
                gap: 20px;
                text-align: center;
            }

            .google-logo svg {
                width: 70px;
                height: 70px;
            }

            .rating-row {
                justify-content: center;
                flex-wrap: wrap;
            }

            .rating-number {
                font-size: 44px;
            }

            .stars {
                justify-content: center;
            }

            .star {
                width: 26px;
                height: 26px;
            }

            .review-count {
                font-size: 26px;
            }

            .social-icons {
                gap: 16px;
                margin-top: 24px;
            }

            .social-icon svg {
                width: 36px;
                height: 36px;
            }
        }

        /* Small phones */
        @media (max-width: 360px) {
            .widget-title {
                font-size: 26px;
            }

            .review-card {
                padding: 24px 16px;
            }

            .rating-number {
                font-size: 38px;
            }

            .star {
                width: 24px;
                height: 24px;
            }

            .review-count {
                font-size: 22px;
            }

            .social-icons {
                gap: 12px;
            }

            .social-icon svg {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>

                        <svg class="star" viewBox="0 0 24 24">

                        </svg>
                    </div>
                </div>
                <div class="review-count">14881 reviews</div>
            </div>
        </div>
