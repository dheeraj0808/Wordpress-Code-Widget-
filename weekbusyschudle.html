<!-- Popular Times Widget for WordPress -->
<!-- Copy this ENTIRE code and paste it in your WordPress HTML block or Custom HTML widget -->

<div id="popular-times-widget" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <style>
        #popular-times-widget * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        #popular-times-widget {
            width: 100%;
            height: 28vh;
            min-height: 200px;
            background: #ffffff;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        #popular-times-widget .pt-header {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #000000;
            text-align: left;
        }

        #popular-times-widget .pt-days {
            display: flex;
            gap: 3px;
            margin-bottom: 6px;
            justify-content: space-between;
        }

        #popular-times-widget .pt-day {
            font-size: 10px;
            font-weight: 500;
            color: #aaaaaa;
            cursor: pointer;
            transition: color 0.2s;
            padding-bottom: 3px;
            position: relative;
            flex: 1;
            text-align: center;
        }

        #popular-times-widget .pt-day.active {
            color: #ff8533;
        }

        #popular-times-widget .pt-day.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 2px;
            background: #ff8533;
            border-radius: 2px;
        }

        #popular-times-widget .pt-info {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
            font-size: 9px;
        }

        #popular-times-widget .pt-icon {
            font-size: 12px;
        }

        #popular-times-widget .pt-time {
            color: #ff8533;
            font-weight: 600;
        }

        #popular-times-widget .pt-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex: 1;
            gap: 3px;
            margin-bottom: 4px;
            padding: 0 2px 4px 2px;
            border-bottom: 2px solid #333333;
        }

        #popular-times-widget .pt-bar {
            flex: 1;
            background: linear-gradient(180deg, #ff9955 0%, #ff8533 100%);
            border-radius: 50px;
            min-width: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #popular-times-widget .pt-bar:hover {
            transform: scaleX(1.15);
        }

        #popular-times-widget .pt-bar.bar-active {
            background: linear-gradient(180deg, #ff6600 0%, #cc4400 100%);
            transform: scaleX(1.2) scaleY(1.05);
            box-shadow: 0 2px 8px rgba(255, 133, 51, 0.5);
        }

        #popular-times-widget .pt-labels {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
            margin-top: 3px;
        }

        #popular-times-widget .pt-label {
            font-size: 9px;
            font-weight: 600;
            color: #333333;
        }

        #popular-times-widget .pt-hours {
            text-align: center;
            margin-top: 6px;
            font-size: 10px;
            font-weight: 600;
            color: #ff8533;
        }
    </style>

    <div class="pt-header">Popular Times</div>

    <div class="pt-days">
        <div class="pt-day" data-day="mon">Mon</div>
        <div class="pt-day" data-day="tue">Tue</div>
        <div class="pt-day" data-day="wed">Wed</div>
        <div class="pt-day" data-day="thu">Thu</div>
        <div class="pt-day active" data-day="fri">Fri</div>
        <div class="pt-day" data-day="sat">Sat</div>
        <div class="pt-day" data-day="sun">Sun</div>
    </div>

    <div class="pt-info">
        <span class="pt-icon">👥</span>
        <span><span class="pt-time" id="pt-peak-time">1pm:</span> <span id="pt-peak-text">Usually as busy as it
                gets</span></span>
    </div>

    <div class="pt-chart" id="pt-chart"></div>

    <div class="pt-labels">
        <span class="pt-label">9a</span>
        <span class="pt-label">12p</span>
        <span class="pt-label">3p</span>
        <span class="pt-label">6p</span>
    </div>

    <div class="pt-hours">9:30 AM - 7:30 PM (Sunday Open)</div>
</div>

<script>
    (function () {
        const popularityData = {
            mon: [30, 35, 40, 45, 60, 70, 65, 75, 55, 40],
            tue: [35, 40, 45, 50, 65, 75, 70, 80, 60, 45],
            wed: [40, 45, 50, 55, 70, 80, 75, 85, 65, 50],
            thu: [45, 50, 55, 60, 75, 85, 80, 90, 70, 55],
            fri: [50, 55, 60, 65, 80, 90, 85, 100, 75, 60],
            sat: [60, 65, 70, 75, 85, 95, 90, 95, 80, 65],
            sun: [40, 45, 50, 55, 65, 75, 70, 75, 60, 45]
        };

        const timeLabels = ['9am', '10am', '11am', '12pm', '1pm', '2pm', '3pm', '4pm', '5pm', '6pm'];

        const peakTimes = {
            mon: { time: '12pm', text: 'Moderately busy' },
            tue: { time: '12pm', text: 'Getting busier' },
            wed: { time: '1pm', text: 'Usually busy' },
            thu: { time: '1pm', text: 'Very busy time' },
            fri: { time: '1pm', text: 'Usually as busy as it gets' },
            sat: { time: '12pm', text: 'Peak weekend hours' },
            sun: { time: '12pm', text: 'Busy Sunday afternoon' }
        };

        function getBusyDescription(value) {
            if (value < 40) return 'Not too busy';
            if (value < 65) return 'Usually a little busy';
            if (value < 85) return 'Usually as busy as it gets';
            return 'Peak busy time';
        }

        let currentDay = 'fri';

        function renderChart(day) {
            const chart = document.getElementById('pt-chart');
            if (!chart) return;

            chart.innerHTML = '';
            const data = popularityData[day];

            data.forEach((value, index) => {
                const bar = document.createElement('div');
                bar.className = 'pt-bar';
                bar.style.height = value + '%';
                bar.dataset.time = timeLabels[index];
                bar.dataset.value = value;
                bar.dataset.index = index;

                bar.addEventListener('click', function (e) {
                    e.stopPropagation();
                    document.querySelectorAll('.pt-bar').forEach(b => b.classList.remove('bar-active'));
                    this.classList.add('bar-active');

                    const time = this.dataset.time;
                    const busyValue = this.dataset.value;
                    const description = getBusyDescription(parseInt(busyValue));

                    document.getElementById('pt-peak-time').textContent = time + ':';
                    document.getElementById('pt-peak-text').textContent = description;
                });

                chart.appendChild(bar);
            });
        }

        function updateInfo(day) {
            const peak = peakTimes[day];
            document.getElementById('pt-peak-time').textContent = peak.time + ':';
            document.getElementById('pt-peak-text').textContent = peak.text;
            document.querySelectorAll('.pt-bar').forEach(b => b.classList.remove('bar-active'));
        }

        document.querySelectorAll('.pt-day').forEach(dayEl => {
            dayEl.addEventListener('click', () => {
                const day = dayEl.dataset.day;
                document.querySelectorAll('.pt-day').forEach(d => d.classList.remove('active'));
                dayEl.classList.add('active');
                currentDay = day;
                renderChart(day);
                updateInfo(day);
            });
        });

        // Initial render
        renderChart(currentDay);
    })();
</script>
