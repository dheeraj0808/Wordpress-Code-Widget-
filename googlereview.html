<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Reviews Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .google-review-widget {
            max-width: 540px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .widget-title {
            font-size: 38px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: #1f1f1f;
        }

        .review-card {
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 16px;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 36px;
        }

        .google-logo {
            flex-shrink: 0;
        }

        .review-info {
            flex: 1;
            min-width: 0;
        }

        .info-label {
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 8px;
            color: #202124;
        }

        .rating-number {
            font-size: 52px;
            font-weight: 700;
            line-height: 1.1;
            color: #1f1f1f;
            margin-bottom: 4px;
        }

        .stars {
            display: flex;
            gap: 2px;
            margin-bottom: 12px;
        }

        .star {
            width: 28px;
            height: 28px;
        }

        .review-count {
            font-size: 32px;
            font-weight: 700;
            color: #1f1f1f;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .widget-title {
                font-size: 34px;
            }

            .review-card {
                padding: 36px 28px;
                gap: 30px;
            }

            .rating-number {
                font-size: 48px;
            }

            .review-count {
                font-size: 28px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            .google-review-widget {
                margin: 24px auto;
            }

            .widget-title {
                font-size: 30px;
                margin-bottom: 16px;
            }

            .review-card {
                flex-direction: column;
                padding: 28px 20px;
                gap: 20px;
                text-align: center;
            }

            .google-logo svg {
                width: 70px;
                height: 70px;
            }

            .rating-number {
                font-size: 44px;
            }

            .stars {
                justify-content: center;
                margin-bottom: 10px;
            }

            .star {
                width: 26px;
                height: 26px;
            }

            .review-count {
                font-size: 26px;
            }
        }

        /* Small phones */
        @media (max-width: 360px) {
            .widget-title {
                font-size: 26px;
            }

            .review-card {
                padding: 24px 16px;
            }

            .rating-number {
                font-size: 38px;
            }

            .star {
                width: 24px;
                height: 24px;
            }

            .review-count {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="google-review-widget">
        <h2 class="widget-title">Reviews</h2>
        <div class="review-card">

        </div>
    </div>
</body>

</html>
